<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prevod teploty</title>
</head>
<body>
    <h1>Prevod teploty</h1>

    <form method="POST">
        {% csrf_token %}
        <label for="teplota">Teplota:</label>
        <input
            type="number"
            id="teplota"
            name="teplota"
            step="any"
            value="{{ povodna_teplota }}"
            required
        >

        <label for="smer">Smer prevodu:</label>
        <select id="smer" name="smer">
            <option value="c_to_f" {% if smer == "c_to_f" %}selected{% endif %}>
                °C → °F
            </option>
            <option value="f_to_c" {% if smer == "f_to_c" %}selected{% endif %}>
                °F → °C
            </option>
        </select>

        <button type="submit">Previesť</button>
    </form>

    {% if vysledok %}
        <h2>Výsledok:</h2>
        <p>{{ vysledok }}</p>
    {% endif %}
</body>
</html>
